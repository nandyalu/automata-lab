@if (expanded()) {
  <aside class="panel" [attr.aria-label]="heading() + ' information'">
    <div class="panel-header">
      <span class="panel-title">{{ heading() }}</span>
      <button
        type="button"
        class="close-btn"
        (click)="toggle()"
        aria-label="Collapse info panel"
      >✕</button>
    </div>
    <div class="panel-body">
      <ng-content />
    </div>
  </aside>
} @else {
  <button
    type="button"
    class="info-btn"
    (click)="toggle()"
    aria-label="Expand info panel"
  ><span aria-hidden="true">i</span></button>
}
